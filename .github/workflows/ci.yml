name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install lightgbm numpy pandas
      - name: Backend tests
        working-directory: backend
        run: python -m pytest
      - name: Producer tests
        working-directory: producers
        run: python -m pytest
      - name: Pipeline transform tests
        working-directory: pipeline
        run: python -m pytest
      - name: ML tests
        working-directory: ml
        run: python -m pytest
      - name: Integration + security audit
        working-directory: integration
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
