# Render.com blueprint (free web service) — see deployment.md §3.2
services:
  - type: web
    name: trendcast-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Serverless mode (decision 027): no broker is deployed, so the API uses
      # NullProducer (decision 010). KAFKA_BOOTSTRAP_SERVERS is intentionally
      # absent — config.py defaults it and it is never read while disabled.
      - key: KAFKA_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
