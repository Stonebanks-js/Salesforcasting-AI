# Render.com blueprint (free web service) — see deployment.md §3.2
services:
  - type: web
    name: trendcast-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_ENABLED
        value: "false"   # serverless mode (decision 027): sales read from Supabase
      - key: CORS_ORIGINS
        sync: false
